        bonus_title: "Available offers",
        signup_btn: "View offer",
        footer_text: "Zicote compares publicly available odds from the bookmakers shown. Odds can change at any time: always check the final odds and terms with the bookmaker before making any decision.",
        nav_matches: "Matches", nav_odds: "Odds", nav_bonus: "Offers", nav_share: "Share",
        copied: "Link copied",
        back_aria: "Back",
        yes: "Yes", no: "No",
        types: {
            "1X2": "Result (1X2)",
            "Total_2.5": "Total goals (2.5)",
            "Double_Chance": "Double chance",
            "BTTS": "Both teams to score",
            "Handicap": "Handicap",
            "Totals": "Other goal totals",
            "Score_Exact": "Correct score"
        }
    }
};

const Zicote_i18n = (() => {
    const supported = navigator.language && navigator.language.toLowerCase().startsWith("en") ? "en" : "fr";
    let lang = "fr";
    try { lang = localStorage.getItem("zicote_lang") || supported; } catch (e) { lang = supported; }
    let rerender = () => {};
    const dict = () => I18N[lang] || I18N.fr;
    const t = key => dict()[key] ?? key;

    function mount(id, onChange) {
        rerender = typeof onChange === "function" ? onChange : () => {};
        const host = document.getElementById(id);
        if (!host) return;
        host.innerHTML = `
            <button type="button" data-lang="fr" title="Français" aria-label="Français">🇫🇷</button>
            <button type="button" data-lang="en" title="English" aria-label="English">🇬🇧</button>`;
        const update = () => host.querySelectorAll("button").forEach(btn => btn.classList.toggle("is-active", btn.dataset.lang === lang));
        host.querySelectorAll("button").forEach(btn => btn.addEventListener("click", () => {
            if (lang === btn.dataset.lang) return;
            lang = btn.dataset.lang;
            try { localStorage.setItem("zicote_lang", lang); } catch (e) {}
            update();
            rerender();
        }));
        update();
        rerender();
    }

    return { t, mount, get lang() { return lang; }, get types() { return dict().types; } };
})();

const $ = id => document.getElementById(id);
const match = JSON.parse($("match-data").textContent);

const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const hue = s => [...s].reduce((a, c) => a + c.charCodeAt(0), 0) * 47 % 360;
const init = s => s.split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase();

const TYPE_ORDER = ["1X2", "Total_2.5", "Double_Chance", "BTTS", "Handicap", "Totals", "Score_Exact"];
const SPOTLIGHT_TYPES = ["1X2", "Total_2.5", "Double_Chance", "BTTS"];

function rowLabel(m) {
    const t = Zicote_i18n.t;
    if (m.type === "Totals") {
        const [line, sens] = m.marche.split("|");
        return (sens === "Plus de" ? "+" : "-") + line.replace(".", ",");
    }
    const map = {
        V1: "1", X: "X", V2: "2",
        "Plus de": "+2,5", "Moins de": "-2,5",
        "1X": "1X", "12": "12", "2X": "X2",
        Oui: t("yes"), Non: t("no")
    };
    return map[m.marche] || m.marche;
}

function logo(site) {
    const n = esc(NAMES[site] || site);
    return `<span class="lg">${LOGOS[site] ? `<img src="${LOGOS[site]}" alt="${n}" loading="lazy">` : n}</span>`;
}

function link(site, inner, cls) {
    const url = AFFILIATE_LINKS[site];
    const c = cls ? ` class="${cls}"` : "";
    return url ? `<a${c} href="${url}" target="_blank" rel="noopener sponsored">${inner}</a>` : `<div${c}>${inner}</div>`;
}

function team(name, logo) {
    // Logo/drapeau si disponible, sinon badge a initiales (repli aussi si l'image ne charge pas).
    const initiales = `<span class="av" style="background:hsl(${hue(name)} 55% 45%)">${esc(init(name))}</span>`;
    if (!logo) return `<div class="tm">${initiales}${esc(name)}</div>`;
    const repli = initiales.replace(/"/g, "&quot;");
    return `<div class="tm"><span class="av av-img"><img src="${esc(logo)}" alt="" loading="lazy" width="32" height="32" onerror="this.parentNode.outerHTML='${repli}'"></span>${esc(name)}</div>`;
}

function pill(site, value, fav) {
    return link(site, `${logo(site)}<b>${value}</b>`, "pill" + (fav ? " fav" : ""));
}

function bestOverall() {
    const pool = match.marches.filter(m => SPOTLIGHT_TYPES.includes(m.type));
    let best = null;
    for (const m of pool) {
        if (AFFILIATE_LINKS[m.meilleur_site] && (!best || m.meilleure_cote > best.meilleure_cote)) best = m;
    }
    if (!best) for (const m of pool) if (!best || m.meilleure_cote > best.meilleure_cote) best = m;
    return best;
}

function renderHero() {
    const t = Zicote_i18n.t;
    const get = k => match.marches.find(x => x.type === "1X2" && x.marche === k);
    const rows = ["V1", "X", "V2"].map(get);
    let odds = "";

    if (rows.some(Boolean)) {
        const vals = rows.map(r => r ? r.meilleure_cote : Infinity);
        const fav = vals.indexOf(Math.min(...vals));
        const labels = [t("home_label"), t("draw_label"), t("away_label")];
        odds = `<div class="odds">${rows.map((r, i) => `<div class="od"><label>${labels[i]}</label>${
            r ? pill(r.meilleur_site, r.meilleure_cote, fav === i)
              : `<div class="pill"><span class="lg"></span><b>–</b></div>`
        }</div>`).join("")}</div>`;
    } else {
        const b = bestOverall();
        if (b) {
            odds = `<div class="odds auto"><div class="od"><label>${esc((Zicote_i18n.types[b.type] || b.type) + " · " + rowLabel(b))}</label>${pill(b.meilleur_site, b.meilleure_cote, true)}</div></div>`;
        }
    }

    $("hero").innerHTML = `<section class="comp"><h2>${esc(t("hero_title"))}</h2>
        <div class="m first">${team(match.equipe_1, match.logo_1)}${team(match.equipe_2, match.logo_2)}${odds}</div></section>`;
}

function ratesAreIdentical(rows, columns) {
    if (columns.length < 2) return false;
    return rows.every(m => {
        const v = columns.map(b => m.valeurs[b]);
        return v.every(x => Math.abs(x - v[0]) < 0.005);
    });
}

function pillsFor(rows, site) {
    const url = AFFILIATE_LINKS[site];
    return `<div class="odds auto">${rows.map(m =>
        `<div class="od"><label>${esc(rowLabel(m))}</label>${url
            ? pill(site, m.valeurs[site] ?? "–", true)
            : `<div class="pill fav">${logo(site)}<b>${m.valeurs[site] ?? "–"}</b></div>`}</div>`
    ).join("")}</div>`;
}

function marketGroup(type) {
    const t = Zicote_i18n.t;
    const rows = match.marches.filter(m => m.type === type);
    if (!rows.length) return "";

    const columns = (match.bookmakers || []).filter(b => rows.some(m => m.valeurs[b] !== undefined));
    if (!columns.length) return "";

    const title = Zicote_i18n.types[type] || type;
    let body;

    if (columns.length === 1) {
        const b = columns[0];
        body = `<p class="src">${esc(t("best_at"))} ${link(b, logo(b))}</p>${pillsFor(rows, b)}`;
    } else if (ratesAreIdentical(rows, columns)) {
        const linked = columns.find(b => AFFILIATE_LINKS[b]) || columns[0];
        const names = esc(columns.map(b => NAMES[b] || b).join(", "));
        const nm = AFFILIATE_LINKS[linked]
            ? `<a href="${AFFILIATE_LINKS[linked]}" target="_blank" rel="noopener sponsored">${names}</a>`
            : names;
        body = `<p class="src">${esc(t("same_at"))} ${nm}</p>${pillsFor(rows, linked)}`;
    } else {
        const head = columns.map(b => `<th>${link(b, logo(b))}</th>`).join("");
        const trs = rows.map(m => {
            const cells = columns.map(b => {
                const v = m.valeurs[b] ?? "–";
                const best = b === m.meilleur_site;
                const cls = "cell" + (best ? " best" : "");
                return `<td>${best ? link(b, v, cls) : `<span class="${cls}">${v}</span>`}</td>`;
            }).join("");
            return `<tr><th scope="row">${esc(rowLabel(m))}</th>${cells}</tr>`;
        }).join("");
        body = `<div class="tw"><table class="tbl"><thead><tr><th></th>${head}</tr></thead><tbody>${trs}</tbody></table></div>`;
        return `<section class="comp"><h2>${esc(title)}</h2>${body}</section>`;
    }

    return `<section class="comp"><h2>${esc(title)}</h2><div class="bd">${body}</div></section>`;
}

function bonus() {
    const t = Zicote_i18n.t;
    const rows = BOOKMAKERS.filter(b => AFFILIATE_LINKS[b]).map(b =>
        `<a class="r" href="${AFFILIATE_LINKS[b]}" target="_blank" rel="noopener sponsored">${logo(b)}<span class="n">${esc(NAMES[b])}</span><span class="go">${esc(t("signup_btn"))}</span></a>`).join("");
    $("bonus").innerHTML = `<h2>${esc(t("bonus_title"))}</h2>${rows}`;
}

function applyStaticStrings() {
    const t = Zicote_i18n.t;
    document.documentElement.lang = Zicote_i18n.lang;
    $("chipLabel").textContent = t("chip_football");
    $("count").textContent = (match.bookmakers || []).length;
    $("upd").textContent = (match.bookmakers || []).length + " " + t("bookmakers");
    $("barTitle").textContent = t("chip_football");
    $("barSubtitle").textContent = t("bar_subtitle");
    $("footerText").textContent = t("footer_text");
    $("navMatches").textContent = t("nav_matches");
    $("navOdds").textContent = t("nav_odds");
    $("navBonus").textContent = t("nav_bonus");
    $("navShare").textContent = t("nav_share");
    $("backBtn").setAttribute("aria-label", t("back_aria"));
    $("backBtn").title = t("back_aria");
}

function rerender() {
    applyStaticStrings();
    renderHero();
    const present = new Set(match.marches.map(m => m.type));
    $("marketCards").innerHTML = TYPE_ORDER.filter(x => present.has(x)).map(marketGroup).join("");
    bonus();
}

$("tshare").addEventListener("click", async e => {
    e.preventDefault();
    const url = location.href;
    const title = `${match.equipe_1} – ${match.equipe_2} · Zicote`;
    if (navigator.share) {
        try { await navigator.share({ title, url }); return; } catch (err) { /* annulé */ }
    }
    try { await navigator.clipboard.writeText(url); } catch (err) { /* indisponible */ }
    const toast = $("toast");
    toast.textContent = Zicote_i18n.t("copied");
    toast.classList.add("on");
    setTimeout(() => toast.classList.remove("on"), 1800);
});

Zicote_i18n.mount("langSwitch", rerender);
</script>
</body>
</html>
