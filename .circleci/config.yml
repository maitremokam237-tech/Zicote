version: 2.1

jobs:
  verify:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Verify project files
          command: |
            test -f scraper.py
            test -f comparateur.py
            test -f requirements.txt
            test -f docs/index.html
            echo "Fichiers du projet vérifiés"

workflows:
  zicote:
    jobs:
      - verify
