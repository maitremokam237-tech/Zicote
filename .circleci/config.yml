version: 2.1

jobs:
  deploy:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout

      - run:
          name: Verify project files
          command: |
            test -f docs/index.html
            echo "Project files verified"

      - run:
          name: Publish JSON data to docs
          command: |
            set -e
            mkdir -p docs
            find . -maxdepth 1 -type f -name "*.json" -exec cp {} docs/ \;

      - run:
          name: Push deployment files
          command: |
            set -e
            git config user.name "CircleCI"
            git config user.email "circleci@users.noreply.github.com"
            git remote set-url origin git@github.com:maitremokam237-tech/Zicote.git
            git add docs/
            if ! git diff --cached --quiet; then
              git commit -m "Update website data [skip ci]"
              git push origin HEAD:main
            fi

workflows:
  zicote:
    jobs:
      - deploy