version: 2.1

jobs:
  deploy:
    docker:
      - image: cimg/node:22.0

    steps:
      - checkout

      - run:
          name: Vérifier les fichiers du site
          command: |
            test -f docs/index.html
            echo "Fichiers du site trouvés."

      - run:
          name: Déployer sur Cloudflare
          command: |
            npx --yes wrangler deploy --config wrangler.jsonc

workflows:
  zicote-deployment:
    jobs:
      - deploy
