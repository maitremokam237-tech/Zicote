name: Zicote - Update Odds

on:
workflow_dispatch:
schedule:
- cron: "0 */6 * * *"

permissions:
contents: write

concurrency:
group: zicote-scraper
cancel-in-progress: false

jobs:
update:
runs-on: ubuntu-latest
timeout-minutes: 30

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"
      cache: "pip"

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
      python -m playwright install --with-deps chromium

  - name: Run scraper
    env:
      WEBSHARE_HOST: ${{ secrets.WEBSHARE_HOST }}
      WEBSHARE_PORT: ${{ secrets.WEBSHARE_PORT }}
      WEBSHARE_USERNAME: ${{ secrets.WEBSHARE_USERNAME }}
      WEBSHARE_PASSWORD: ${{ secrets.WEBSHARE_PASSWORD }}
    run: python scraper.py

  - name: Commit updated data
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add .
      if ! git diff --cached --quiet; then
        git commit -m "Update sports data"
        git push
      else
        echo "No changes to commit"
      fi
