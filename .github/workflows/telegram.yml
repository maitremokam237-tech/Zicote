name: Zicote - Telegram

on:
  workflow_dispatch:

  schedule:
    # 09:00 heure Cameroun
    # = 08:00 UTC
    - cron: "0 8 * * *"

    # 14:00 heure Cameroun
    # = 13:00 UTC
    - cron: "0 13 * * *"

    # 19:00 heure Cameroun
    # = 18:00 UTC
    - cron: "0 18 * * *"

permissions:
  contents: read

concurrency:
  group: zicote-telegram
  cancel-in-progress: false

jobs:

  publish:
    name: Publier 5 matchs sur Telegram

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ======================================================
      # INSTALLATION
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ======================================================
      # VÉRIFICATION DES DONNÉES
      # ======================================================

      - name: Verify comparison data
        run: |
          test -f docs/comparison.json

          echo "comparison.json trouvé."

          python - <<'PY'
          import json

          with open(
              "docs/comparison.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          matches = data.get("matchs", [])

          print(
              f"Nombre de matchs disponibles : {len(matches)}"
          )

          if not matches:
              raise SystemExit(
                  "Aucun match dans comparison.json"
              )
          PY

      # ======================================================
      # PUBLICATION TELEGRAM
      # ======================================================

      - name: Publish 5 matches to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "-1003545879698"
        run: |
          python telegram_publisher.py
